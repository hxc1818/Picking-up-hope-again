name: Remote Forge Mod Build (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Forge Mod (1.18.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 7.4.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.4.2'

      - name: Build with Gradle
        run: |
          cd mod
          gradle build jar --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== Content of mod/build ==="
          ls -la build || true
          ls -la build/libs || true

      - name: Locate Built Jars
        run: |
          echo "=== Finding all generated JAR files in workspace ==="
          find . -name "*.jar" -type f

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: picking-hope-core-mod-jar
          path: |
            **/build/libs/*.jar
          if-no-files-found: warn
