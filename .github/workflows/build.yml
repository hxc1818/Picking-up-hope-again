name: Remote Forge Mod Build (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Forge Mod (1.18.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./mod/gradlew" ]; then
            chmod +x ./mod/gradlew
          fi

      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon
          elif [ -f "./mod/gradlew" ]; then
            cd mod && ./gradlew build --no-daemon
          else
            echo "No gradlew found yet. Skeleton initialized successfully."
          fi

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod-jars
          path: |
            build/libs/*.jar
            mod/build/libs/*.jar
          if-no-files-found: ignore
