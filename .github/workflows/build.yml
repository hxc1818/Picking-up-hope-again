name: Remote Forge Mod Build (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Forge Mod (1.18.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 7.4.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.4.2'

      - name: Build with Gradle
        run: |
          cd mod
          gradle build jar --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== Gradle build finished with exit code $? ==="

      - name: Publish Built Files to Dist Branch
        if: always()
        run: |
          echo "Listing all files in mod/build:"
          find mod -type f | head -n 100
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B dist
          git add -f mod/build/ || true
          git add -f mod/build.log || true
          git commit -m "build: publish compiled artifacts and log [skip ci]" || echo "No changes to commit"
          git push -f origin dist || echo "Push to dist failed"
