name: Remote Forge Mod Build (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Forge Mod (1.18.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper
        run: |
          TARGET_DIR="."
          if [ -d "mod" ] && [ -f "mod/build.gradle" ]; then
            TARGET_DIR="mod"
          fi
          cd "$TARGET_DIR"
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper (7.4.2) for Forge 1.18.2..."
            gradle wrapper --gradle-version 7.4.2 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          TARGET_DIR="."
          if [ -d "mod" ] && [ -f "mod/build.gradle" ]; then
            TARGET_DIR="mod"
          fi
          cd "$TARGET_DIR"
          ./gradlew build --no-daemon --stacktrace

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod-jars
          path: |
            build/libs/*.jar
            mod/build/libs/*.jar
          if-no-files-found: warn
